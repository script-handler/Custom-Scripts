<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:1280px;height:800px;line-height:1.3;overflow:hidden;background:#06080A;font-family:{{ t.font }};color:{{ t.text }};-webkit-font-smoothing:antialiased;clip-path:{{ t.clipP }}">
<dc-import name="AimViewport" theme="{{ th }}" scene="{{ vscene }}" mode="{{ mode }}" w="1280" h="800" big="{{ true }}" hud="{{ false }}" style="position:absolute;left:0;top:0;width:1280px;height:800px" hint-size="1280px,800px"></dc-import>
<div style="position:absolute;left:24px;top:24px;display:flex;align-items:center;gap:10px">
<div style="width:44px;height:44px;border-radius:12px;clip-path:{{ t.clipC }};background:{{ t.primary }};color:{{ t.onPrimary }};display:flex;align-items:center;justify-content:center;box-shadow:{{ t.logoSh }}">
<svg width="20" height="20" style="transform:scale(1.2);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round"><path d="M4.5 10a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0M10 1.8v4M10 14.2v4M1.8 10h4M14.2 10h4"></path></svg>
</div>
<div style="font-size:18px;font-weight:700;letter-spacing:-.015em;color:{{ t.brandC }};text-shadow:{{ t.tsh }}">AimLab</div>
<div style="height:44px;padding:0 14px;box-sizing:border-box;display:flex;align-items:center;gap:8px;background:{{ t.hud }};border:1px solid {{ t.border }};border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};backdrop-filter:blur(14px);cursor:pointer">
<svg width="20" height="20" style="fill:none;stroke:{{ t.acText }};stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="{{ icon }}"></path></svg>
<span style="font-size:14px;font-weight:650">{{ scName }}</span><span style="font-size:12.5px;color:{{ t.muted }}">{{ scMeta }}</span>
<svg width="20" height="20" style="transform:scale(.8);fill:none;stroke:{{ t.muted }};stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M6 8l4 4 4-4"></path></svg>
</div>
</div>
<sc-if value="{{ showTiles }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:50%;top:20px;transform:translateX(-50%);display:flex;gap:8px">
<sc-for list="{{ tiles }}" as="tl" hint-placeholder-count="4">
<div style="position:relative;width:132px;height:62px;padding:9px 12px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;background:{{ t.hud }};border:1px solid {{ t.border }};border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};backdrop-filter:blur(14px)">
<div style="font-size:9px;font-weight:600;letter-spacing:.14em;color:{{ t.muted }}">{{ tl.l }}</div>
<div style="display:flex;align-items:baseline;gap:3px;font-family:{{ t.num }};font-variant-numeric:tabular-nums"><span style="font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1;color:{{ tl.vc }}">{{ tl.v }}</span><span style="font-size:12px;font-weight:600;color:{{ t.muted }}">{{ tl.u }}</span><span style="font-size:12px;font-weight:700;color:{{ t.acText }};margin-left:4px">{{ tl.sub }}</span></div>
<sc-if value="{{ tl.hasBar }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:12px;right:12px;bottom:7px;height:3px;border-radius:2px;background:{{ t.track }};overflow:hidden"><div style="width:{{ tl.barW }};height:100%;background:{{ t.primary }}"></div></div>
</sc-if>
<sc-if value="{{ tl.hasPips }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:12px;bottom:7px;display:flex;gap:3px"><sc-for list="{{ tl.pips }}" as="pi" hint-placeholder-count="3"><span style="width:16px;height:3px;border-radius:2px;background:{{ pi.c }}"></span></sc-for></div>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
<div style="position:absolute;right:24px;top:24px;display:flex;gap:8px">
<div style="height:44px;padding:0 14px;box-sizing:border-box;display:flex;align-items:center;gap:7px;background:{{ t.hud }};border:1px solid {{ t.border }};border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};backdrop-filter:blur(14px);cursor:pointer">
<svg width="20" height="20" style="fill:none;stroke:{{ t.gold }};stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M6.5 3.5h7v4a3.5 3.5 0 0 1-7 0ZM6.5 5H4.2a2.4 2.4 0 0 0 2.6 3M13.5 5h2.3a2.4 2.4 0 0 1-2.6 3M10 11v3M7 16.5h6"></path></svg>
<span style="font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums">{{ best }}</span><span style="font-size:12px;color:{{ t.muted }}">best</span>
</div>
</div>
<div style="position:absolute;left:24px;bottom:30px;height:34px;padding:0 12px;display:flex;align-items:center;gap:8px;background:{{ t.hud }};border:1px solid {{ t.border }};border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};backdrop-filter:blur(14px);font-size:12px;color:{{ t.muted }}">
<span style="width:7px;height:7px;border-radius:50%;background:{{ statusC }}"></span>{{ status }}
<sc-if value="{{ showEsc }}" hint-placeholder-val="{{ true }}"><span style="padding:1px 6px;border:1px solid {{ t.border }};border-radius:5px;background:{{ t.key }};font-size:10.5px;font-weight:700;color:{{ t.text }}">Esc</span>pause</sc-if>
</div>
<div style="position:absolute;right:24px;bottom:30px;height:34px;padding:0 12px;display:flex;align-items:center;gap:6px;background:{{ t.hud }};border:1px solid {{ t.border }};border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};backdrop-filter:blur(14px);font-size:12px;color:{{ t.muted }}">{{ rankTag }}</div>
<div style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:6px;display:flex;gap:6px;background:{{ t.hud }};border:1px solid {{ t.border }};border-radius:{{ t.rbar }}px;clip-path:{{ t.clipC }};backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.35)">
<div style="height:44px;padding:0 18px;display:flex;align-items:center;gap:8px;border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};background:{{ t.primary }};color:{{ t.onPrimary }};font-size:13.5px;font-weight:650;cursor:pointer">
<sc-if value="{{ isRun }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><path d="M7.5 5v10M12.5 5v10"></path></svg>Pause</sc-if>
<sc-if value="{{ isStop }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round"><path d="M6.5 4.2 15.8 10 6.5 15.8Z"></path></svg>Play</sc-if>
</div>
<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:{{ t.rc }}px;cursor:pointer"><svg width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1M4.5 3.5v3h3"></path></svg></div>
<div style="width:88px;height:44px;box-sizing:border-box;padding:3px;display:flex;gap:2px;border-radius:{{ t.rc }}px;clip-path:{{ t.clipC }};border:1px solid {{ t.border }};opacity:{{ segOp }}">
<div style="flex:1;display:flex;align-items:center;justify-content:center;border-radius:9px;background:{{ s2bg }};border:1px solid {{ s2bd }};box-sizing:border-box;font-size:12px;font-weight:700;color:{{ s2c }}">2D</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;border-radius:9px;background:{{ s3bg }};border:1px solid {{ s3bd }};box-sizing:border-box;font-size:12px;font-weight:700;color:{{ s3c }}">3D</div>
</div>
<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><path d="M4.5 10a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0M10 2v4M10 14v4M2 10h4M14 10h4"></path></svg></div>
<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><path d="M3.5 6h8M15.5 6h1M3.5 14h1M8.5 14h8M11.5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M4.5 14a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg></div>
<div style="width:1px;margin:8px 2px;background:{{ t.border }}"></div>
<div style="height:44px;padding:0 12px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:600"><svg width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M7.5 3.5v4h-4M12.5 3.5v4h4M7.5 16.5v-4h-4M12.5 16.5v-4h4"></path></svg>Exit</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;,&quot;cyber&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chaos3d&quot;,&quot;chaos2d&quot;,&quot;rGo&quot;,&quot;ares&quot;,&quot;endless&quot;,&quot;campDone&quot;],&quot;default&quot;:&quot;chaos3d&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;2d&quot;,&quot;3d&quot;],&quot;default&quot;:&quot;3d&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PRI = 'linear-gradient(135deg,#7048FF 0%,#3D5CF5 52%,#2563EB 100%)';
const TOK = {
  dark: { text: '#F4F2FA', muted: '#B3B0C6', border: 'rgba(255,255,255,.16)', hud: 'rgba(18,16,28,.66)', acText: '#6CBBFF', red: '#FF5D73', redText: '#FF8396', gold: '#FFCB6B', good: '#3DDC97', primary: PRI, onPrimary: '#FFFFFF', font: "'Inter',system-ui,sans-serif", num: "'Inter',system-ui,sans-serif", rc: 12, rbar: 16, clipP: 'none', clipC: 'none', track: 'rgba(255,255,255,.14)', key: 'rgba(255,255,255,.1)', selBg: 'rgba(79,172,254,.2)', selBd: 'rgba(79,172,254,.6)', logoSh: '0 4px 14px rgba(112,72,255,.45)', brandC: '#F4F2FA', tsh: '0 1px 10px rgba(0,0,0,.5)' },
  light: { text: '#0F172A', muted: '#475569', border: 'rgba(15,23,42,.12)', hud: 'rgba(255,255,255,.82)', acText: '#0369A1', red: '#FF5D73', redText: '#BE123C', gold: '#B45309', good: '#15803D', primary: PRI, onPrimary: '#FFFFFF', font: "'Inter',system-ui,sans-serif", num: "'Inter',system-ui,sans-serif", rc: 12, rbar: 16, clipP: 'none', clipC: 'none', track: 'rgba(15,23,42,.12)', key: 'rgba(15,23,42,.06)', selBg: 'rgba(79,172,254,.16)', selBd: 'rgba(3,105,161,.45)', logoSh: '0 4px 12px rgba(112,72,255,.3)', brandC: '#0F172A', tsh: 'none' },
  cyber: { text: '#E8FDFF', muted: '#8CB8BF', border: 'rgba(0,240,255,.4)', hud: 'rgba(2,10,14,.8)', acText: '#00F0FF', red: '#FF2E63', redText: '#FF6B8F', gold: '#FFE600', good: '#39FF88', primary: '#00F0FF', onPrimary: '#021014', font: "'JetBrains Mono',ui-monospace,monospace", num: "'JetBrains Mono',ui-monospace,monospace", rc: 0, rbar: 0, clipP: 'none', clipC: 'polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)', track: 'rgba(0,240,255,.18)', key: 'rgba(0,240,255,.12)', selBg: 'rgba(0,240,255,.14)', selBd: '#00F0FF', logoSh: '0 0 14px rgba(0,240,255,.5)', brandC: '#E8FDFF', tsh: '0 0 10px rgba(0,240,255,.5)' }
};
const C = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
const ICON = { Chaos: C(6, 7, 2.6) + C(14.5, 6.5, 2) + C(11, 14.5, 3), Screen: 'M3 4.5h14v11H3zM10.8 7l-2.3 3.3h3l-2.3 3.2', Endless: 'M10 10c-2-2.6-3.4-3.6-5-3.6a3.6 3.6 0 0 0 0 7.2c1.6 0 3-1 5-3.6s3.4-3.6 5-3.6a3.6 3.6 0 0 1 0 7.2c-1.6 0-3-1-5-3.6Z', Levels: 'M4.5 17.5V3M4.5 3.5h10l-2.5 3.5 2.5 3.5h-10' };
class Component extends DCLogic {
  renderVals() {
    const p = this.props, th = TOK[p.theme] ? p.theme : 'dark', t = TOK[th];
    const scene = p.scene || 'chaos3d', isR = scene === 'rGo' || scene === 'rWait', isRes = scene === 'ares';
    const mode = scene === 'chaos2d' ? '2d' : isR ? '2d' : (p.mode || '3d');
    const tile = (l, v, u, x) => Object.assign({ l, v, u, sub: '', vc: t.text, hasBar: false, barW: '0%', hasPips: false, pips: [] }, x || {});
    const tiles = isR
      ? [tile('ROUND', '3', '/5'), tile('LAST', '198', 'ms'), tile('AVERAGE', '211', 'ms'), tile('FALSE STARTS', '1', '/3', { hasPips: true, pips: [0, 1, 2].map(i => ({ c: i < 1 ? t.red : t.track })) })]
      : scene === 'chaos2d'
        ? [tile('TIME', '18.4', 's', { hasBar: true, barW: '61%' }), tile('SCORE', '255', ''), tile('ACCURACY', '89', '%'), tile('STREAK', '6', '', { sub: '×1.5' })]
        : [tile('TIME', '12.7', 's', { hasBar: true, barW: '42%' }), tile('SCORE', '330', ''), tile('ACCURACY', '84', '%'), tile('STREAK', '9', '', { sub: '×2.0' })];
    const on = { bg: t.selBg, bd: t.selBd, c: t.text }, off = { bg: 'transparent', bd: 'transparent', c: t.muted };
    const s2 = isR ? off : mode === '2d' ? on : off, s3 = isR ? off : mode === '3d' ? on : off;
    const SP = {
      endless: { tiles: [tile('TIME', '12.6', 's', { hasBar: true, barW: '63%' }), tile('SCORE', '4,820', ''), tile('LEVEL', '4', ''), tile('STREAK', '8', '', { sub: '×1.5' })], icon: ICON.Endless, scName: 'Endless', scMeta: '2D · Normal', best: '17,200', status: 'Free cursor', rankTag: 'Normal · ranked', run: 1 },
      campDone: { tiles: [], icon: ICON.Levels, scName: 'Levels', scMeta: '2D · Campaign', best: '26/30', status: 'Campaign complete', rankTag: 'Normal · ranked', run: 0 }
    };
    const X = SP[scene];
    if (X) return { th, t, mode: '2d', vscene: scene, showTiles: !!X.run, tiles: X.tiles, isRun: !!X.run, isStop: !X.run, icon: X.icon, scName: X.scName, scMeta: X.scMeta, best: X.best, status: X.status, statusC: X.run ? t.good : t.muted, showEsc: !!X.run, rankTag: X.rankTag, segOp: 1, s2bg: on.bg, s2bd: on.bd, s2c: on.c, s3bg: off.bg, s3bd: off.bd, s3c: off.c };
    return {
      th, t, mode, vscene: scene, showTiles: !isRes, tiles, isRun: !isRes, isStop: isRes,
      icon: ICON[isR ? 'Screen' : 'Chaos'], scName: isR ? 'Screen' : 'Chaos', scMeta: isR ? 'Reaction · Normal' : `${mode.toUpperCase()} · Normal`,
      best: isR ? '198 ms' : mode === '3d' ? '540' : '730',
      status: isRes ? 'Run complete' : mode === '3d' && !isR ? 'Mouse locked' : isR ? 'Click anywhere on GO' : 'Free cursor', statusC: isRes ? t.muted : t.good, showEsc: !isRes,
      rankTag: isR || mode === '2d' ? 'Normal · ranked' : 'Normal · local best (3D)',
      segOp: isR ? .38 : 1, s2bg: s2.bg, s2bd: s2.bd, s2c: s2.c, s3bg: s3.bg, s3bd: s3.bd, s3c: s3.c
    };
  }
}
</script>
</body>
</html>
